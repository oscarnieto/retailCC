name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/exciting-carson-tcutca"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: ensamblar y habilitar Pages (sin binding de environment,
  # para evitar el startup failure cuando Pages aún no está activado).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html css js fonts vendor assets .nojekyll _site/
          echo "---- _site ----"
          ls -R _site | head -50

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Job 2: desplegar. Sin bloque `environment:` para evitar el gate de
  # protección del entorno que rechaza el arranque del job.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
