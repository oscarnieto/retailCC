name: Publish GitHub Pages

# Publica la web sirviendo directamente la RAÍZ de esta rama (build clásico de
# Pages). Evita el entorno protegido `github-pages` que rechazaba el deploy
# basado en Actions. Usa el GITHUB_TOKEN (pages: write) para fijar la fuente.

on:
  push:
    branches: ["claude/exciting-carson-tcutca"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-source
  cancel-in-progress: false

jobs:
  set-pages-source:
    runs-on: ubuntu-latest
    steps:
      - name: Point GitHub Pages at this branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          PAYLOAD="{\"build_type\":\"legacy\",\"source\":{\"branch\":\"${BRANCH}\",\"path\":\"/\"}}"
          echo "Updating Pages source -> ${BRANCH} (/) ..."
          CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "${PAYLOAD}")
          echo "PUT /pages -> HTTP ${CODE}"; cat /tmp/resp.json || true; echo
          if [ "${CODE}" = "404" ]; then
            echo "Pages site not found — creating it..."
            CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d "${PAYLOAD}")
            echo "POST /pages -> HTTP ${CODE}"; cat /tmp/resp.json || true; echo
          fi
          if [ "${CODE}" != "200" ] && [ "${CODE}" != "201" ] && [ "${CODE}" != "204" ]; then
            echo "::error::No se pudo fijar la fuente de Pages (HTTP ${CODE})."
            exit 1
          fi
          echo "OK. Pages servirá desde la raíz de ${BRANCH}."
          # Lanza una construcción inmediata de Pages
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages/builds" \
            -w "\nPOST /pages/builds -> HTTP %{http_code}\n" || true
